name: Process Video Queue

on:
  schedule:
    - cron: '*/20 * * * *'  # запуск каждые 20 минут
  workflow_dispatch:        # кнопка ручного запуска

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # разрешение боту сохранять tasks.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py
      - name: Commit progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tasks.json
          git commit -m "Auto-update tasks queue [skip ci]" || exit 0
          git push
